<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home page</title>
</head>
<body>
    {% if session['user'] %}
        <p>Hi, {{ session['user']['userName'] }}!</p>
        <a href="{{ url_for('profile') }}">Profile</a><br>
        <a href="{{ url_for('employee_dashboard') }}">Employee Section</a><br>
        <a href="{{ url_for('oauth.logout') }}">Logout</a><br>
    {% else %}
        <a href="{{ url_for('oauth.login') }}">Login</a><br>
        <a href="{{ url_for('register.register') }}">Register</a><br>
    {% endif %}
</body>
</html>
